name: Python CI CD
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
    init:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            - name: pyton setup
              uses: actions/setup-python@v4
              with:
                python-version: "3.12"
                cache: pip
            - name: Instalar Dependencias
              run: pip install -r requirements.txt
    test:
        runs-on: ubuntu-latest
        needs: init
        steps:
            - name: Checkout Repostorio
              uses: actions/checkout@v4
            - name: python setup
              uses: actions/setup-python@v4
              with: 
                python-version: "3.12"
                cache: pip
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            - name: Iniciar Test
              run: |
                pytest

              
