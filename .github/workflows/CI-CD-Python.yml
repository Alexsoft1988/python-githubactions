name: Python CI CD
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
    init:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            - name: pyton setup
              uses: actions/setup-python@v4
              with:
                python-version: "3.12"
                cache: pip
            - name: Instalar Dependencias
              run: pip install -r requirements.txt
    test:
        runs-on: ubuntu-latest
        needs: init
        steps:
            - name: Checkout Repostorio
              uses: actions/checkout@v4
            - name: python setup
              uses: actions/setup-python@v4
              with: 
                python-version: "3.12"
                cache: pip
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            - name: Iniciar Test
              run: |
                pytest
            - name: Compilar con PyInstaller
              run: pyinstaller --onefile source/main.py
            - name: Subir ejecutable como artefacto
              uses: actions/upload-artifact@v7
              with:
                name: ejecutable-linux
                path: source/main.py
                if-no-files-found: error
                retention-days: 1
            - name: Login to Dockerhub
              run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_NAME }}" --password-stdin

            - name: Set Image Name
              id: vars
              run: echo "IMAGE_NAME=${{ secrets.DOCKERHUB_NAME }}/$(basename ${{ github.repository}})" > "$GITHUB_ENV"
        
            - name: Build The Docker Image
              run: docker build -t $IMAGE_NAME:latest .

            - name: Push The Docker Image
              run: docker push $IMAGE_NAME:latest 

              
