name: CI-CD-Pythonreutilizable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: 
  
jobs:
  ci:
    uses: Alexsoft1988/python-reusable-template/.github/workflows/ci-python-template.yml@main
    with:
      python-version: '3.12'
      coverage: false
      archivo-requerimiento: 'requirements.txt'
      archivo-compilado: 'source/main.py'
  build:
    needs: ci
    uses: Alexsoft1988/python-reusable-template/.github/workflows/docker-Reusable.yml@main
    with:
      image-name: python-app
      dockerfile-path: "."
    secrets:
      REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      REGISTRY_NAME: ${{ secrets.DOCKERHUB_NAME }}
